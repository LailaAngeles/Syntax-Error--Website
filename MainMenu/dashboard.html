<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Overview | SyntaxError</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="modern-enhancements.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="data-analysis.css">
    <link rel="stylesheet" href="terms-gate.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="dashboard.js"></script>
    <script type="module" src="terms-gate.js"></script>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h2 class="logo"><span class="sti-text">STI</span><span class="game-title"> Caloocan</span></h2>
        <button id="theme-toggle" class="theme-btn" title="Switch light or dark mode" aria-label="Switch light or dark mode">
            <i class="bi bi-moon-stars-fill"></i>
        </button>
    </div>
    <ul>
        <li class="active">
            <a href="dashboard.html" aria-current="page"><i class="bi bi-speedometer2"></i> <span>Dashboard</span></a>
        </li>
        <li>
            <a href="Levels.html"><i class="bi bi-key-fill"></i> <span>Levels</span></a>
        </li>
        <li>
            <a href="Students.html"><i class="bi bi-people"></i> <span>Students</span></a>
        </li>
        <li>
            <a href="archive.html"><i class="bi bi-archive"></i> <span>Archive</span></a>
        </li>
        <li><a href="../help.html" target="_blank" rel="noopener" title="Open the user manual in a new tab"><i class="bi bi-question-circle"></i> <span>Help</span></a></li>
        <li onclick="showLogoutPopup()">
            <a href="#"><i class="bi bi-box-arrow-right"></i> <span>LogOut</span></a>
        </li>
    </ul>
</div>

<div class="main-content">
    <header class="da-page-head">
        <div>
            <h1>Class Overview <span class="da-live" title="Updates automatically when the game saves new records"><span></span> Live</span></h1>
            <p>Game records for your sections: <span id="user-section-display">loading...</span></p>
        </div>
        <div class="da-toolbar">
            <label class="da-filter" for="section-select">Section
                <select id="section-select"><option value="">All my sections</option></select>
            </label>
            <button type="button" class="da-btn" id="export-csv"><i class="bi bi-download"></i> Export student summary (CSV)</button>
        </div>
    </header>

    <div id="class-overview" data-da-class aria-live="polite">
        <p class="da-empty">Loading game records...</p>
    </div>
</div>

<div id="logout-popup" class="logout-modal" style="display:none;">
    <div class="logout-box">
        <h3>Confirm Logout</h3>
        <p>Are you sure you want to exit the dashboard?</p>
        <div class="logout-btns">
            <button class="btn-stay" onclick="closeLogoutPopup()">Stay</button>
            <button class="danger" onclick="logoutUser()">Logout</button>
        </div>
    </div>
</div>

<div id="loading-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; flex-direction:column; align-items:center; justify-content:center;">
    <div class="spinner"></div>
    <p class="loading-text">Loading records...</p>
</div>

    <script src="modern-effects.js" defer></script>
</body>
</html>
